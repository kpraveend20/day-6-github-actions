name: Day 6 CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: Application Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Check project files
        shell: pwsh
        run: |
          if (-not (Test-Path "README.md")) {
            throw "README.md is missing"
          }
          if (-not (Test-Path "scripts/health-check.ps1")) {
            throw "Health check script is missing"
          }
          Write-Output "Required project files found."

      - name: Run application health check
        shell: pwsh
        run: ./scripts/health-check.ps1
